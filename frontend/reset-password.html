<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConChordia Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
</head>
<body class="auth-body login-page">
    <main class="page login-page-content">
        <div class="auth-logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>

        <p class="auth-intro">Choose a new password (at least 8 characters).</p>

        <form class="login-form" id="resetForm" novalidate>
            <div class="login-field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="login-field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Type it again" autocomplete="new-password" required>
            </div>
            <p class="form-message" id="resetMessage" role="alert"></p>
            <button type="submit" id="resetButton" class="wide-button">Reset Password</button>
        </form>

        <p class="form-success" id="resetSuccess" role="status"></p>

        <p class="account-text">
            <a href="login.html">Back to Login</a>
        </p>
    </main>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetMessage = document.getElementById("resetMessage");
        const resetSuccess = document.getElementById("resetSuccess");
        const resetButton = document.getElementById("resetButton");

        // The link looks like reset-password.html?token=abc123...
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) {
            resetMessage.textContent = "This reset link is invalid. Please request a new one from the Forgot Password page.";
            resetButton.disabled = true;
        }

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {
                resetMessage.textContent = "Password must be at least 8 characters.";
                return;
            }
            if (newPassword !== confirmPassword) {
                resetMessage.textContent = "Passwords do not match.";
                return;
            }

            resetMessage.textContent = "";
            resetButton.disabled = true;
            try {
                await api.post("/auth/reset-password", {
                    token: token,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                });
                // Any old login on this browser belongs to the old password; start fresh.
                localStorage.removeItem("token");
                resetForm.hidden = true;
                resetSuccess.textContent = "Your password has been reset. You can log in now.";
            } catch (error) {
                resetMessage.textContent = error.message;
                resetButton.disabled = false;
            }
        });
    </script>
</body>
</html>
