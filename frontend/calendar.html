
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - ConChordia</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="artist-profile.html">Artist Profile</a>
            <a href="contacts.html">Contacts</a>
            <a href="projects.html">Projects</a>
            <a href="calendar.html" class="active">Calendar</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="revenue.html">Revenue</a>
            <a href="network.html">Network</a>
            <a href="settings.html">Settings</a>
        </nav>
    </div>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Calendar</h1>
                <p>Manage bookings, follow-ups, project deadlines, and opportunities.</p>
            </div>
        </header>

        <section class="dashboard-card">
            <div class="calendar-header">
                <h2 id="monthTitle"></h2>
                <div class="calendar-buttons">
                    <button class="calendar-btn" id="prevMonth">←</button>
                    <button class="calendar-btn" id="todayButton">Today</button>
                    <button class="calendar-btn" id="nextMonth">→</button>
                    <button class="calendar-btn" id="addEventButton">+ Add Event</button>
                </div>
            </div>

            <div class="calendar-filters">
                <label>
                    <input type="checkbox" class="event-filter" value="Booking" checked>
                    Bookings
                </label>
                <label>
                    <input type="checkbox" class="event-filter" value="Follow-Up" checked>
                    Follow-Ups
                </label>
                <label>
                    <input type="checkbox" class="event-filter" value="Project Deadline" checked>
                    Project Deadlines
                </label>
                <label>
                    <input type="checkbox" class="event-filter" value="Opportunity" checked>
                    Opportunities
                </label>
                <label>
                    <input type="checkbox" class="event-filter" value="Personal" checked>
                    Personal
                </label>
            </div>

            <details class="calendar-category-settings">
                <summary>Customize Calendar Colors</summary>
                <div class="calendar-category-colors">
                    <label class="calendar-category-color">
                        <input type="color" data-category="Booking">
                        Bookings
                    </label>
                    <label class="calendar-category-color">
                        <input type="color" data-category="Follow-Up">
                        Follow-Ups
                    </label>
                    <label class="calendar-category-color">
                        <input type="color" data-category="Project Deadline">
                        Project Deadlines
                    </label>
                    <label class="calendar-category-color">
                        <input type="color" data-category="Opportunity">
                        Opportunities
                    </label>
                    <label class="calendar-category-color">
                        <input type="color" data-category="Personal">
                        Personal
                    </label>
                </div>
                <button type="button" class="calendar-btn calendar-category-reset" id="resetCategoryColors">
                    Reset Default Colors
                </button>
            </details>

            <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <div class="calendar-bottom">
            <section class="dashboard-card">
                <h2 id="selectedDateTitle">Selected Date</h2>
                <div id="selectedDateEvents"></div>
            </section>

            <section class="dashboard-card" id="eventFormCard" hidden>
                <h2 id="eventFormTitle">Add Event</h2>
                <form class="calendar-form" id="eventForm">
                    <label for="eventName">Event Name *</label>
                    <input type="text" id="eventName" required>

                    <label for="eventCategory">Category</label>
                    <select id="eventCategory">
                        <option value="Booking">Booking</option>
                        <option value="Follow-Up">Follow-Up</option>
                        <option value="Personal">Personal</option>
                    </select>

                    <label for="eventDate">Date *</label>
                    <input type="date" id="eventDate" required>

                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime">

                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" placeholder="Venue or location">

                    <label for="eventNotes">Notes</label>
                    <textarea id="eventNotes" rows="4" placeholder="Additional event details"></textarea>

                    <div class="calendar-form-actions">
                        <button type="submit" class="calendar-btn">Save Event</button>
                        <button type="button" class="calendar-btn" id="cancelEvent">Cancel</button>
                        <button type="button" class="calendar-btn calendar-delete" id="deleteEvent" hidden>
                            Delete Event
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <p id="calendarMessage" role="status"></p>

        <div class="calendar-export">
            <button class="calendar-btn" id="exportButton">
                Export Calendar (.ics)
            </button>
        </div>
    </main>

    <script>
    const $ = id => document.getElementById(id);

    $("sidebarToggle").onclick = () => {
        document.querySelector(".sidebar").classList.toggle("collapsed");
    };

    const calendarGrid = $("calendarGrid");
    const selectedDateEvents = $("selectedDateEvents");
    const eventForm = $("eventForm");
    const eventFormCard = $("eventFormCard");
    const calendarMessage = $("calendarMessage");

    const defaultColors = {
        "Booking": "#176c8d",
        "Follow-Up": "#865a12",
        "Project Deadline": "#9b315f",
        "Opportunity": "#b45309",
        "Personal": "#416a38"
    };

    function validColor(color) {
        return typeof color === "string" &&
            /^#[0-9a-fA-F]{6}$/.test(color);
    }

    function loadCategoryColors() {
        try {
            const saved = JSON.parse(
                localStorage.getItem("conchordiaCategoryColors") || "{}"
            );
            const colors = { ...defaultColors };
            for (const category of Object.keys(defaultColors)) {
                if (validColor(saved[category])) {
                    colors[category] = saved[category];
                }
            }
            return colors;
        } catch {
            return { ...defaultColors };
        }
    }

    let categoryColors = loadCategoryColors();
    let events = [];
    let projects = [];
    let opportunities = [];
    let editingId = null;

    const today = new Date();
    let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDate = dateKey(today);

    function dateKey(date) {
        return [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, "0"),
            String(date.getDate()).padStart(2, "0")
        ].join("-");
    }

    function displayDate(value) {
        if (!value) return "—";
        const parts = value.split("-");
        return parts.length === 3
            ? `${parts[1]}/${parts[2]}/${parts[0]}`
            : value;
    }

    function formatTime12(time) {
        if (!time) return "";

        const [hours, minutes] = time.split(":").map(Number);
        const period = hours >= 12 ? "PM" : "AM";
        const hour = hours % 12 || 12;

        return `${hour}:${String(minutes).padStart(2, "0")} ${period}`;
    }

    function dateFromDatabase(value) {
        if (!value) return "";

        // PostgreSQL timestamps are converted to the user's local date.
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : dateKey(date);
    }

    function timeFromDatabase(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return [
            String(date.getHours()).padStart(2, "0"),
            String(date.getMinutes()).padStart(2, "0")
        ].join(":");
    }

    function bookingToEvent(booking) {
        return {
            id: booking.id,
            name: booking.title,
            title: booking.title,
            category: booking.category || "Booking",
            date: dateFromDatabase(booking.startsAt),
            time: timeFromDatabase(booking.startsAt),
            location: booking.venueName || booking.venueCity || "",
            notes: booking.notes || "",
            source: "calendar",
            original: booking
        };
    }

    function projectToEvent(project) {
        return {
            id: "project-" + project.id,
            name: project.title || "Project Deadline",
            title: project.title || "Project Deadline",
            category: "Project Deadline",
            date: String(project.deadline || "").slice(0, 10),
            time: "",
            location: "",
            notes: project.notes || "",
            source: "project"
        };
    }

    function opportunityToEvent(opportunity) {
        return {
            id: "opportunity-" + opportunity.id,
            name: opportunity.name || opportunity.title || "Opportunity",
            title: opportunity.name || opportunity.title || "Opportunity",
            category: "Opportunity",
            date: String(opportunity.deadline || "").slice(0, 10),
            time: "",
            location: opportunity.organization || "",
            notes: opportunity.notes || "",
            source: "opportunity"
        };
    }

    async function apiRequest(path, options = {}) {
        const token = localStorage.getItem("conchordiaToken");

        if (!token) {
            window.location.href = "login.html";
            throw new Error("Please log in.");
        }

        const response = await fetch("/api" + path, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
                ...options.headers
            }
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("conchordiaToken");
            window.location.href = "login.html";
            throw new Error("Session expired.");
        }

        if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || `Request failed (${response.status})`);
        }

        if (response.status === 204) return null;
        return response.json();
    }

    async function loadCalendar() {
        calendarMessage.textContent = "Loading calendar...";

        try {
            // Bookings, Follow-Ups and Personal events share this table.
            const [bookingsData, projectsData] = await Promise.all([
                apiRequest("/bookings"),
                apiRequest("/projects")
            ]);

            events = bookingsData.map(bookingToEvent);
            projects = projectsData;

            // Opportunities can be connected when that endpoint is ready.
            try {
                opportunities = await apiRequest("/opportunities");
                if (!Array.isArray(opportunities)) opportunities = [];
            } catch (error) {
                console.warn("Opportunities unavailable:", error.message);
                opportunities = [];
            }

            calendarMessage.textContent = "";
            renderCalendar();
        } catch (error) {
            calendarMessage.textContent = error.message;
            console.error(error);
        }
    }

    function allEvents() {
        const projectEvents = projects
            .filter(project => project.deadline)
            .map(projectToEvent);

        const opportunityEvents = opportunities
            .filter(opportunity =>
                opportunity.deadline &&
                opportunity.status !== "Rejected" &&
                opportunity.status !== "Closed"
            )
            .map(opportunityToEvent);

        return [...events, ...projectEvents, ...opportunityEvents];
    }

    function visibleCategories() {
        return Array.from(
            document.querySelectorAll(".event-filter:checked")
        ).map(input => input.value);
    }

    function visibleEvents() {
        const categories = visibleCategories();
        return allEvents().filter(event =>
            categories.includes(event.category)
        );
    }

    function eventClass(category) {
        return {
            "Booking": "booking",
            "Follow-Up": "followup",
            "Project Deadline": "deadline",
            "Opportunity": "opportunity",
            "Personal": "personal"
        }[category] || "personal";
    }

    function renderCalendar() {
        calendarGrid.replaceChildren();

        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();

        $("monthTitle").textContent =
            currentMonth.toLocaleDateString("en-US", {
                month: "long",
                year: "numeric"
            });

        ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
            .forEach(name => {
                const header = document.createElement("div");
                header.className = "calendar-day-name";
                header.textContent = name;
                calendarGrid.appendChild(header);
            });

        const startOffset = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const totalCells = Math.ceil(
            (startOffset + daysInMonth) / 7
        ) * 7;

        const calendarEvents = visibleEvents();

        for (let i = 0; i < totalCells; i++) {
            const date = new Date(year, month, i - startOffset + 1);
            const key = dateKey(date);

            const day = document.createElement("button");
            day.type = "button";
            day.className = "calendar-day";

            if (date.getMonth() !== month) {
                day.classList.add("other-month");
            }
            if (key === dateKey(new Date())) {
                day.classList.add("today");
            }
            if (key === selectedDate) {
                day.classList.add("selected");
            }

            const number = document.createElement("span");
            number.className = "day-number";
            number.textContent = date.getDate();
            day.appendChild(number);

            calendarEvents
                .filter(event => event.date === key)
                .forEach(event => {
                    const label = document.createElement("span");
                    label.className =
                        "calendar-event " + eventClass(event.category);

                    label.textContent = event.time
                        ? `${formatTime12(event.time)} ${event.name}`
                        : event.name;

                    label.style.backgroundColor =
                        categoryColors[event.category] ||
                        defaultColors.Personal;

                    day.appendChild(label);
                });

            day.onclick = () => {
                selectedDate = key;
                renderCalendar();
            };

            calendarGrid.appendChild(day);
        }

        renderSelectedDate();
    }

    function renderSelectedDate() {
        selectedDateEvents.replaceChildren();

        $("selectedDateTitle").textContent =
            "Events for " + displayDate(selectedDate);

        const dayEvents = visibleEvents()
            .filter(event => event.date === selectedDate)
            .sort((a, b) =>
                (a.time || "").localeCompare(b.time || "")
            );

        if (!dayEvents.length) {
            const empty = document.createElement("p");
            empty.className = "calendar-empty";
            empty.textContent = "No events scheduled for this date.";
            selectedDateEvents.appendChild(empty);
            return;
        }

        dayEvents.forEach(event => {
            const item = document.createElement("div");
            item.className = "calendar-list-item";

            function addText(tag, content) {
                const element = document.createElement(tag);
                element.textContent = content;
                item.appendChild(element);
            }

            addText("h3", event.name || "Untitled Event");
            addText("p", "Category: " + event.category);

            const indicator = document.createElement("span");
            indicator.style.cssText =
                "display:inline-block;width:16px;height:16px;" +
                "border-radius:4px;margin-bottom:8px;";
            indicator.style.backgroundColor =
                categoryColors[event.category] || defaultColors.Personal;
            item.appendChild(indicator);

            if (event.time) addText("p", "Time: " + formatTime12(event.time));
            if (event.location) addText("p", "Location: " + event.location);
            if (event.notes) addText("p", "Notes: " + event.notes);

            if (event.source === "project" ||
                event.source === "opportunity") {

                const isProject = event.source === "project";
                addText("p", isProject
                    ? "Imported from Projects"
                    : "Imported from Opportunities");

                const link = document.createElement("a");
                link.href = isProject
                    ? "projects.html"
                    : "opportunities.html";
                link.textContent = isProject
                    ? "View Projects"
                    : "View Opportunities";
                item.appendChild(link);
            } else {
                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "calendar-btn";
                editButton.textContent = "Edit";
                editButton.onclick = () => openForm(event);
                item.appendChild(editButton);
            }

            selectedDateEvents.appendChild(item);
        });
    }

    function openForm(event = null) {
        if (event && event.source !== "calendar") {
            calendarMessage.textContent =
                "Edit imported events from their original page.";
            return;
        }

        eventForm.reset();
        editingId = event ? event.id : null;

        $("eventFormTitle").textContent =
            event ? "Edit Event" : "Add Event";

        $("eventName").value = event ? event.name : "";
        $("eventCategory").value =
            event ? event.category : "Booking";
        $("eventDate").value =
            event ? event.date : selectedDate;
        $("eventTime").value = event ? event.time : "";
        $("eventLocation").value = event ? event.location : "";
        $("eventNotes").value = event ? event.notes : "";
        $("deleteEvent").hidden = !event;

        eventFormCard.hidden = false;
        eventFormCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    function closeForm() {
        eventFormCard.hidden = true;
        editingId = null;
        eventForm.reset();
    }

    $("addEventButton").onclick = () => openForm();
    $("cancelEvent").onclick = closeForm;

    eventForm.onsubmit = async function(e) {
        e.preventDefault();

        const name = $("eventName").value.trim();
        const category = $("eventCategory").value;
        const date = $("eventDate").value;
        const time = $("eventTime").value;
        const location = $("eventLocation").value.trim();
        const notes = $("eventNotes").value.trim();

        if (!name || !date) {
            calendarMessage.textContent =
                "Enter an event name and date.";
            return;
        }

        // Convert local date/time to a PostgreSQL-compatible timestamp.
        // A date without a time is stored at local midnight.
        const startsAt = new Date(
            `${date}T${time || "00:00"}:00`
        ).toISOString();

        const existing = editingId
            ? events.find(event => event.id === editingId)
            : null;

        const payload = {
            title: name,
            category,
            startsAt,
            venueName: location || null,
            venueCity: existing?.original?.venueCity || null,
            venueContactId:
                existing?.original?.venueContactId || null,
            status: existing?.original?.status || "Confirmed",
            fee: existing?.original?.fee || 0,
            notes
        };

        try {
            calendarMessage.textContent = "Saving event...";

            if (editingId) {
                await apiRequest("/bookings/" + editingId, {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
            } else {
                await apiRequest("/bookings", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
            }

            selectedDate = date;
            const [year, month] = date.split("-").map(Number);
            currentMonth = new Date(year, month - 1, 1);

            closeForm();
            await loadCalendar();
            calendarMessage.textContent = "Event saved successfully.";
        } catch (error) {
            calendarMessage.textContent = error.message;
            console.error(error);
        }
    };

    $("deleteEvent").onclick = async function() {
        if (!editingId) return;
        if (!confirm("Are you sure you want to delete this event?")) {
            return;
        }

        try {
            await apiRequest("/bookings/" + editingId, {
                method: "DELETE"
            });

            closeForm();
            await loadCalendar();
            calendarMessage.textContent = "Event deleted.";
        } catch (error) {
            calendarMessage.textContent = error.message;
            console.error(error);
        }
    };

    $("prevMonth").onclick = () => {
        currentMonth = new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth() - 1,
            1
        );
        renderCalendar();
    };

    $("nextMonth").onclick = () => {
        currentMonth = new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth() + 1,
            1
        );
        renderCalendar();
    };

    $("todayButton").onclick = () => {
        const now = new Date();
        currentMonth = new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );
        selectedDate = dateKey(now);
        renderCalendar();
    };

    document.querySelectorAll(".event-filter").forEach(filter => {
        filter.addEventListener("change", renderCalendar);
    });

    function saveCategoryColors() {
        try {
            localStorage.setItem(
                "conchordiaCategoryColors",
                JSON.stringify(categoryColors)
            );
            return true;
        } catch {
            calendarMessage.textContent =
                "Unable to save calendar colors.";
            return false;
        }
    }

    function updateColorPickers() {
        document.querySelectorAll("[data-category]").forEach(input => {
            input.value = categoryColors[input.dataset.category];
        });

        document.querySelectorAll(".event-filter").forEach(input => {
            input.style.setProperty(
                "--category-color",
                categoryColors[input.value] || defaultColors.Personal
            );
        });
    }

    document.querySelectorAll("[data-category]").forEach(input => {
        input.addEventListener("input", function() {
            categoryColors[this.dataset.category] = this.value;
            saveCategoryColors();
            updateColorPickers();
            renderCalendar();
        });
    });

    $("resetCategoryColors").onclick = () => {
        categoryColors = { ...defaultColors };
        if (saveCategoryColors()) {
            updateColorPickers();
            renderCalendar();
            calendarMessage.textContent =
                "Default calendar colors restored.";
        }
    };

    // Export displayed categories as an .ics calendar file.
    function escapeICS(value) {
        return String(value || "")
            .replace(/\\/g, "\\\\")
            .replace(/\r?\n/g, "\\n")
            .replace(/,/g, "\\,")
            .replace(/;/g, "\\;");
    }

    function exportCalendar() {
        const calendarEvents = visibleEvents()
            .filter(event => event.date);

        if (!calendarEvents.length) {
            calendarMessage.textContent = "No events to export.";
            return;
        }

        const lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//ConChordia//Calendar//EN",
            "CALSCALE:GREGORIAN"
        ];

        const timestamp = new Date()
            .toISOString()
            .replace(/[-:]/g, "")
            .replace(/\.\d{3}/, "");

        calendarEvents.forEach(event => {
            const date = event.date.replace(/-/g, "");
            const title = event.name || event.title || "Event";
            let start, end;

            if (event.time) {
                start = date + "T" +
                    event.time.replace(":", "") + "00";

                const [year, month, day] =
                    event.date.split("-").map(Number);
                const [hour, minute] =
                    event.time.split(":").map(Number);

                const endDate = new Date(
                    year, month - 1, day, hour + 1, minute
                );

                end = dateKey(endDate).replace(/-/g, "") +
                    "T" +
                    String(endDate.getHours()).padStart(2, "0") +
                    String(endDate.getMinutes()).padStart(2, "0") +
                    "00";
            } else {
                start = date;
                const [year, month, day] =
                    event.date.split("-").map(Number);
                end = dateKey(
                    new Date(year, month - 1, day + 1)
                ).replace(/-/g, "");
            }

            lines.push("BEGIN:VEVENT");
            lines.push("UID:" + String(event.id) + "@conchordia");
            lines.push("DTSTAMP:" + timestamp);

            if (event.time) {
                lines.push("DTSTART:" + start);
                lines.push("DTEND:" + end);
            } else {
                lines.push("DTSTART;VALUE=DATE:" + start);
                lines.push("DTEND;VALUE=DATE:" + end);
            }

            lines.push("SUMMARY:" + escapeICS(title));
            lines.push("DESCRIPTION:" + escapeICS(
                event.category +
                (event.notes ? "\n" + event.notes : "")
            ));
            lines.push("LOCATION:" + escapeICS(event.location));
            lines.push("END:VEVENT");
        });

        lines.push("END:VCALENDAR");

        const blob = new Blob(
            [lines.join("\r\n") + "\r\n"],
            { type: "text/calendar;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "ConChordia-Calendar.ics";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
        calendarMessage.textContent =
            "Calendar exported successfully.";
    }

    $("exportButton").onclick = exportCalendar;

    updateColorPickers();
    loadCalendar();
    </script>

</body>
</html>
