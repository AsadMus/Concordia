
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConChordia Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="page signup-page">
        <div class="auth-logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>
        <form class="signup-form" id="signupForm"> 
            <div class="account-type-section">
                <h3>Choose Your Account Type</h3>
                <div class="account-type-options">
                    <label class="account-type-card">
                        <input type="radio" name="accountType" value="artist" required>
                        <span class="account-type-content">
                            <strong>Artist</strong>
                            <small>Manage your career, connections, projects, and bookings. Join management teams and collectives.</small>
                        </span>
                    </label>
                    <label class="account-type-card">
                        <input type="radio" name="accountType" value="manager" required>
                        <span class="account-type-content">
                            <strong>Manager</strong>
                            <small>Create management teams or collectives, invite artists, and manage your roster.</small>
                        </span>
                    </label>
                </div>
            </div>
            <div class="form-column">
                <input type="text" id="firstName" placeholder="First Name" autocomplete="given-name" required>
                <input type="text" id="lastName" placeholder="Last Name" autocomplete="family-name" required>
                <input type="tel" id="phone" placeholder="Phone Number" autocomplete="tel" required>
            </div>
            <div class="form-column">
                <input type="email" id="email" placeholder="Email Address" autocomplete="email" required>
                <input type="password" id="password" placeholder="Password" autocomplete="new-password" minlength="8" required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="8" required>
            </div>
            <p id="signupError" class="signup-error" role="alert" style="grid-column: 1 / -1;"></p>
            <div class="signup-button">
                <button type="submit">Sign Up</button>
            </div>
        </form>
        <p class="account-text signup-login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
    <script>
        "use strict";
        const signupForm = document.getElementById("signupForm");
        const signupError = document.getElementById("signupError");
        signupForm.addEventListener("submit", function(event) {
            event.preventDefault();
            signupError.textContent = "";
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const selectedRole = document.getElementById("accountType").value;
            if (!selectedRole) {
                signupError.textContent = "Please select an account type.";
                return;
            }
            if (password !== confirmPassword) {
                signupError.textContent = "Passwords do not match.";
                return;
            }
            if (password.length < 8) {
                signupError.textContent = "Password must be at least 8 characters.";
                return;
            }
            const account = {
                firstName,
                lastName,
                phone,
                email,
                role: selectedRole
            };
            try {
                localStorage.setItem("conchordiaAccount", JSON.stringify(account));
                localStorage.setItem("conchordiaAccountType", account.role);
            } catch {
                signupError.textContent = "Unable to save account preferences.";
                return;
            }
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
