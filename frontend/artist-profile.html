
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artist Profile - ConChordia</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
    <script>api.requireLogin();</script>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <button class="sidebar-toggle" id="sidebarToggle">
            ☰
        </button>

        <div class="logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="artist-profile.html" class="active">Artist Profile</a>
            <a href="contacts.html">Contacts</a>
            <a href="projects.html">Projects</a>
            <a href="calendar.html">Calendar</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="revenue.html">Revenue</a>
            <a href="network.html">Network</a>
            <a href="settings.html">Settings</a>
        </nav>

    </div>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Artist Profile</h1>
                <p>Manage your artist information and online presence.</p>
            </div>
        </header>

        <section class="dashboard-card artist-profile-card">

            <h2>Basic Information</h2>

            <form class="artist-profile-form" id="artistProfileForm">

                <label for="stageName">Stage Name</label>
                <input
                    type="text"
                    id="stageName"
                    placeholder="Enter stage name"
                >

                <label for="legalName">Legal Name</label>
                <input
                    type="text"
                    id="legalName"
                    placeholder="Enter legal name"
                >

                <label for="genre">Genre</label>
                <input
                    type="text"
                    id="genre"
                    placeholder="Enter music genre"
                >

                <label for="location">Location</label>
                <input
                    type="text"
                    id="location"
                    placeholder="City, State"
                >

                <h2>Contact Information</h2>

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="###-###-####"
                    maxlength="12"
                    inputmode="numeric"
                    autocomplete="tel"
                >

                <h2>Social Media</h2>

                <label for="instagram">Instagram</label>
                <input
                    type="url"
                    id="instagram"
                    placeholder="https://instagram.com/username"
                >

                <label for="tiktok">TikTok</label>
                <input
                    type="url"
                    id="tiktok"
                    placeholder="https://tiktok.com/@username"
                >

                <label for="youtube">YouTube</label>
                <input
                    type="url"
                    id="youtube"
                    placeholder="https://youtube.com/@username"
                >

                <label for="spotify">Spotify</label>
                <input
                    type="url"
                    id="spotify"
                    placeholder="Spotify artist profile URL"
                >

                <h2>Artist Biography</h2>

                <label for="bio">Biography</label>
                <textarea
                    id="bio"
                    rows="5"
                    placeholder="Tell us about yourself as an artist"
                ></textarea>

                <div class="profile-actions">
                    <button type="button" id="editProfileButton" class="save-profile-button" hidden>
                        Edit Profile
                    </button>

                    <button type="submit" id="saveProfileButton" class="save-profile-button" hidden>
                        Save Changes
                    </button>

                    <button type="button" id="cancelProfileButton" class="save-profile-button" hidden>
                        Cancel
                    </button>
                </div>

                <p id="saveMessage" role="status"></p>

            </form>

        </section>

    </main>

    <!-- JavaScript -->
    <script>

        // Sidebar Toggle
        const sidebar = document.querySelector(".sidebar");
        const toggleButton = document.getElementById("sidebarToggle");

        toggleButton.addEventListener("click", function() {
            sidebar.classList.toggle("collapsed");
        });

        // Artist Profile - saved to the logged-in user's account
        const profileForm = document.getElementById("artistProfileForm");
        const saveMessage = document.getElementById("saveMessage");

        const editButton = document.getElementById("editProfileButton");
        const saveButton = document.getElementById("saveProfileButton");
        const cancelButton = document.getElementById("cancelProfileButton");

        const socialFields = ["instagram", "tiktok", "youtube", "spotify"];
        const field = (id) => document.getElementById(id);

        let savedProfile = null;
        let editing = false;

        function fillForm(user) {
            field("stageName").value = user.stageName || "";
            field("legalName").value =
                [user.firstName, user.lastName].filter(Boolean).join(" ");
            field("genre").value = Array.isArray(user.genres)
                ? user.genres.join(", ")
                : user.genres || "";
            field("location").value = user.location || "";
            field("email").value = user.email || "";
            field("phone").value = formatPhoneNumber(user.phone);
            field("bio").value = user.bio || "";

            socialFields.forEach(function(name) {
                field(name).value = (user.socials || {})[name] || "";
            });
        }

        function setEditMode(enabled) {
            editing = enabled;

            profileForm.querySelectorAll("input, textarea").forEach(function(input) {
                input.readOnly = !enabled;
            });

            editButton.hidden = enabled;
            saveButton.hidden = !enabled;
            cancelButton.hidden = !enabled;

            profileForm.classList.toggle("profile-view-mode", !enabled);
        }

        async function loadProfile() {
            try {
                savedProfile = await api.get("/auth/me");
                fillForm(savedProfile);
                setEditMode(false);
            } catch (error) {
                saveMessage.textContent =
                    "Unable to load profile: " + error.message;
            }
        }

        editButton.addEventListener("click", function() {
            setEditMode(true);
            saveMessage.textContent = "";
            field("stageName").focus();
        });

        cancelButton.addEventListener("click", function() {
            if (savedProfile) {
                fillForm(savedProfile);
            }

            setEditMode(false);
            saveMessage.textContent = "";
        });

        profileForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!editing) return;

            const nameParts = field("legalName")
                .value.trim().split(/\s+/).filter(Boolean);

            if (nameParts.length < 2) {
                saveMessage.textContent =
                    "Please enter your first and last legal name.";
                return;
            }

            const socials = {};

            socialFields.forEach(function(name) {
                socials[name] = field(name).value.trim();
            });

            const profileData = {
                stageName: field("stageName").value,
                firstName: nameParts[0],
                lastName: nameParts.slice(1).join(" "),
                genres: field("genre").value,
                location: field("location").value,
                email: field("email").value,
                phone: field("phone").value,
                bio: field("bio").value,
                socials: socials
            };

            saveMessage.textContent = "Saving...";
            saveButton.disabled = true;

            try {
                savedProfile = await api.put("/auth/me", profileData);

                fillForm(savedProfile);
                setEditMode(false);

                saveMessage.textContent =
                    "Profile saved successfully!";
            } catch (error) {
                saveMessage.textContent =
                    "Unable to save profile: " + error.message;
            } finally {
                saveButton.disabled = false;
            }
        });

        function formatPhoneNumber(value) {
            const digits = String(value || "").replace(/\D/g, "").slice(0, 10);
            if (digits.length > 6) {
                return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
            }
            if (digits.length > 3) {
                return `${digits.slice(0, 3)}-${digits.slice(3)}`;
            }
            return digits;
        }

        field("phone").addEventListener("input", function() {
            this.value = formatPhoneNumber(this.value);
        });

        loadProfile();

    </script>
    <script src="js/profile-dropdown.js"></script>
</body>
</html>
