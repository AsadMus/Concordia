<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConChordia Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
</head>
<body class="auth-body login-page">
    <main class="page login-page-content">
        <div class="auth-logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>

        <p class="auth-intro">Enter your account email and we'll send you a link to reset your password.</p>

        <form class="login-form" id="forgotForm" novalidate>
            <div class="login-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your account email" autocomplete="email" required>
            </div>
            <p class="form-message" id="forgotMessage" role="alert"></p>
            <button type="submit" id="forgotButton" class="wide-button">Send Reset Link</button>
        </form>

        <p class="form-success" id="forgotSuccess" role="status"></p>
        <p class="dev-link" id="devLink"></p>

        <p class="account-text">
            Remembered it?
            <a href="login.html">Login</a>
        </p>
    </main>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const forgotMessage = document.getElementById("forgotMessage");
        const forgotSuccess = document.getElementById("forgotSuccess");
        const forgotButton = document.getElementById("forgotButton");
        const devLink = document.getElementById("devLink");

        forgotForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim();

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                forgotMessage.textContent = "Please enter a valid email address.";
                return;
            }

            forgotMessage.textContent = "";
            forgotSuccess.textContent = "";
            devLink.replaceChildren();
            forgotButton.disabled = true;
            try {
                const result = await api.post("/auth/forgot-password", { email: email });
                forgotSuccess.textContent = result.message;

                // Demo mode only (SHOW_RESET_LINK=true in backend/.env): email isn't set up yet,
                // so show the link here instead. It is also printed in the server terminal.
                if (result.devResetLink) {
                    const link = document.createElement("a");
                    link.href = result.devResetLink;
                    link.textContent = "Open reset link (demo mode)";
                    devLink.append(link);
                }
            } catch (error) {
                forgotMessage.textContent = error.message;
            } finally {
                forgotButton.disabled = false;
            }
        });
    </script>
</body>
</html>
