
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConChordia Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
    <script>api.redirectIfLoggedIn();</script>
</head>
<body class="auth-body login-page">
    <main class="page login-page-content">
        <div class="auth-logo">
            <img src="images/logo.png" alt="ConChordia Logo">
        </div>
        <form id="loginForm" class="login-form">
            <div class="login-field">
                <label for="loginInput">Email or Phone Number</label>
                <input type="text" id="loginInput" name="login" placeholder="Enter your email or phone number" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
            <p id="loginError" class="login-error" role="alert" aria-live="polite" hidden></p>
            <button type="submit" id="loginButton">Login</button>
        </form>
        <p class="account-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const loginError = document.getElementById('loginError');
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            loginError.hidden = true;
            loginError.textContent = '';
            if (!login || !password) {
                loginError.textContent = 'Please enter your email/phone and password.';
                loginError.hidden = false;
                return;
            }
            loginButton.disabled = true;
            loginButton.textContent = 'Logging in...';
            try {
                await api.login(login, password); // saves the token + account info (see js/api.js)
                window.location.replace('dashboard.html');
            } catch (error) {
                loginError.textContent = error.message || 'Unable to log in.';
                loginError.hidden = false;
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
